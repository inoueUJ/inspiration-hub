name: PR Screenshots

# PR ごとに主要画面を撮影し、PR にスクリーンショット付きのコメントを1件（上書き更新）投稿する。
# 撮影中にコンソールエラー / ページ例外が出た場合はジョブを失敗させる（E2E スモークテストを兼ねる）。
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write # 画像を pr-screenshots ブランチへ push する
  pull-requests: write # PR にコメントする

concurrency:
  group: pr-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SCREENSHOTS_BRANCH: pr-screenshots
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  screenshots:
    # フォークからの PR はトークンに書き込み権限がないため対象外。下書き PR も撮影しない
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare local SQLite (schema + seed)
        run: |
          npx drizzle-kit push --force
          npm run db:seed

      - name: Start dev server
        run: |
          npm run dev > dev-server.log 2>&1 &
          for _ in $(seq 1 90); do
            if curl -sf -o /dev/null http://localhost:3000/; then exit 0; fi
            sleep 2
          done
          cat dev-server.log
          exit 1

      - name: Capture screenshots
        id: capture
        continue-on-error: true
        run: npm run screenshots

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-pr-${{ github.event.pull_request.number }}
          path: |
            screenshots/
            dev-server.log
          if-no-files-found: ignore

      - name: Publish images to ${{ env.SCREENSHOTS_BRANCH }} branch
        id: publish
        if: always() && hashFiles('screenshots/manifest.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          dest="pr-${PR_NUMBER}/${HEAD_SHA:0:7}"
          workdir="$(mktemp -d)"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads "$remote" "$SCREENSHOTS_BRANCH" > /dev/null; then
            git clone --quiet --depth 1 --branch "$SCREENSHOTS_BRANCH" "$remote" "$workdir"
          else
            # 初回は履歴を持たない孤立ブランチを作る（main の履歴を汚さない）
            git init --quiet -b "$SCREENSHOTS_BRANCH" "$workdir"
            git -C "$workdir" remote add origin "$remote"
            printf '# PR Screenshots\n\nPR Screenshots ワークフローが自動で push する画像置き場です。手で編集しないでください。\n' > "$workdir/README.md"
          fi

          mkdir -p "$workdir/$dest"
          cp screenshots/*.png screenshots/manifest.json "$workdir/$dest/"

          cd "$workdir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "screenshots: PR #${PR_NUMBER} @ ${HEAD_SHA:0:7}"

          # 別 PR のジョブと同時に push した場合に備えてリトライ
          for attempt in 1 2 3; do
            if git push --quiet origin "$SCREENSHOTS_BRANCH"; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            git pull --quiet --rebase origin "$SCREENSHOTS_BRANCH"
          done

          echo "dest=$dest" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: always() && steps.publish.outcome == 'success'
        uses: actions/github-script@v7
        env:
          DEST: ${{ steps.publish.outputs.dest }}
        with:
          script: |
            const fs = require("node:fs")
            const manifest = JSON.parse(fs.readFileSync("screenshots/manifest.json", "utf8"))
            const { owner, repo } = context.repo
            const pr = context.payload.pull_request
            const marker = "<!-- pr-screenshots -->"
            const branch = process.env.SCREENSHOTS_BRANCH
            const imageUrl = (file) =>
              `https://github.com/${owner}/${repo}/blob/${branch}/${process.env.DEST}/${file}?raw=true`
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`

            const status = manifest.problems.length === 0
              ? "✅ 撮影中のコンソールエラー・ページ例外はありませんでした"
              : [
                  `⚠️ 撮影中に ${manifest.problems.length} 件の問題を検出しました`,
                  "",
                  "```",
                  ...manifest.problems,
                  "```",
                ].join("\n")

            const sections = manifest.shots.map((shot, index) => [
              `<details${index < 3 ? " open" : ""}>`,
              `<summary><b>${shot.title}</b> <code>${shot.path}</code></summary>`,
              "",
              `<img src="${imageUrl(shot.file)}" alt="${shot.title}" width="720">`,
              "",
              "</details>",
            ].join("\n"))

            const body = [
              marker,
              "## 📸 動作スクリーンショット",
              `コミット \`${pr.head.sha.slice(0, 7)}\` ・ [ワークフロー実行ログ](${runUrl})`,
              status,
              ...sections,
            ].join("\n\n")

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            })
            const existing = comments.find(
              (comment) => comment.user?.type === "Bot" && comment.body?.includes(marker)
            )

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body })
            }

      - name: Fail if problems were detected
        if: steps.capture.outcome == 'failure'
        run: |
          echo "::error::撮影中にコンソールエラー・ページ例外・撮影失敗が発生しました。上の Capture screenshots のログを確認してください。"
          exit 1
